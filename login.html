<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masuk – BelajarBareng.id</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    body { display: flex; flex-direction: column; min-height: 100vh; }

    /* ── LAYOUT ── */
    .auth-wrap {
      flex: 1;
      display: flex; align-items: center; justify-content: center;
      padding: 2rem 1.25rem;
      position: relative; z-index: 1;
    }

    .auth-box {
      width: 100%; max-width: 440px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 2.5rem 2rem;
      animation: fadeUp .5s ease both;
    }

    /* ── LOGO ── */
    .auth-logo {
      text-align: center; margin-bottom: 2rem;
    }
    .auth-logo .logo-text {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.4rem; font-weight: 700;
      background: linear-gradient(90deg, var(--purple-light), var(--blue));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .auth-logo .logo-text span { color: var(--yellow); -webkit-text-fill-color: var(--yellow); }
    .auth-logo p { font-size: .82rem; color: var(--muted); margin-top: .25rem; }

    /* ── TABS ── */
    .auth-tabs {
      display: flex; background: var(--bg);
      border-radius: 12px; padding: 4px;
      margin-bottom: 1.75rem;
    }
    .auth-tab {
      flex: 1; padding: .55rem;
      border-radius: 9px; border: none;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: .875rem; font-weight: 700;
      cursor: pointer; transition: all .2s;
      background: transparent; color: var(--muted);
    }
    .auth-tab.active {
      background: var(--purple);
      color: #fff;
      box-shadow: 0 4px 12px rgba(124,58,237,.4);
    }

    /* ── FORM ── */
    .auth-form { display: flex; flex-direction: column; gap: 1rem; }

    .field { display: flex; flex-direction: column; gap: .4rem; }
    .field label {
      font-size: .8rem; font-weight: 700;
      color: var(--muted); letter-spacing: .03em;
    }
    .field input, .field select {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: .75rem 1rem;
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: .9rem;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
      width: 100%;
      appearance: none;
    }
    .field input:focus, .field select:focus {
      border-color: var(--purple);
      box-shadow: 0 0 0 3px rgba(124,58,237,.15);
    }
    .field input::placeholder { color: var(--muted); }
    .field select option { background: var(--card); }

    /* jenjang + kelas row */
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }

    /* kelas pills */
    .kelas-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem;
    }
    .kelas-pill {
      padding: .55rem .5rem; border-radius: 10px; text-align: center;
      font-size: .82rem; font-weight: 700;
      cursor: pointer; border: 1px solid var(--border);
      background: var(--bg); color: var(--muted);
      transition: all .2s;
    }
    .kelas-pill:hover   { border-color: var(--purple); color: var(--text); }
    .kelas-pill.selected {
      background: rgba(124,58,237,.2);
      border-color: var(--purple);
      color: var(--purple-light);
    }

    /* jenjang toggle */
    .jenjang-toggle {
      display: grid; grid-template-columns: 1fr 1fr; gap: .5rem;
      margin-bottom: .25rem;
    }
    .jenjang-btn {
      padding: .6rem; border-radius: 10px; text-align: center;
      font-size: .875rem; font-weight: 700;
      cursor: pointer; border: 1px solid var(--border);
      background: var(--bg); color: var(--muted);
      transition: all .2s;
    }
    .jenjang-btn.selected {
      background: rgba(124,58,237,.2);
      border-color: var(--purple);
      color: var(--purple-light);
    }

    .field-hint {
      font-size: .75rem; color: var(--muted); margin-top: -.25rem;
    }

    /* ── SUBMIT ── */
    .btn-submit {
      width: 100%; padding: .875rem;
      background: linear-gradient(135deg, var(--purple), var(--blue));
      color: #fff; border: none; border-radius: 12px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: .95rem; font-weight: 700;
      cursor: pointer; margin-top: .5rem;
      transition: opacity .2s, transform .2s;
      box-shadow: 0 0 20px rgba(124,58,237,.4);
    }
    .btn-submit:hover { opacity: .9; transform: translateY(-1px); }
    .btn-submit:active { transform: translateY(0); }

    /* ── DIVIDER ── */
    .divider {
      display: flex; align-items: center; gap: .75rem;
      margin: .25rem 0;
    }
    .divider hr { flex: 1; border: none; border-top: 1px solid var(--border); }
    .divider span { font-size: .75rem; color: var(--muted); white-space: nowrap; }

    /* ── ERROR ── */
    .error-msg {
      background: rgba(239,68,68,.15);
      border: 1px solid rgba(239,68,68,.3);
      border-radius: 10px; padding: .65rem 1rem;
      font-size: .82rem; color: #FCA5A5;
      display: none;
    }
    .error-msg.show { display: block; }

    /* ── STEP indicator (register only) ── */
    .step-indicator {
      display: flex; align-items: center; justify-content: center;
      gap: .4rem; margin-bottom: 1.5rem;
    }
    .step-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--border); transition: all .3s;
    }
    .step-dot.active { background: var(--purple); width: 24px; border-radius: 4px; }
    .step-dot.done   { background: #4ADE80; }
  </style>
</head>
</html>
