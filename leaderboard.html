<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leaderboard – BelajarBareng.id</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .page-wrap {
      position: relative; z-index: 1;
      max-width: 900px; margin: 0 auto;
      padding: 2.5rem 1.5rem 5rem;
    }

    .page-head { text-align: center; margin-bottom: 2rem; }
    .page-head h1 { font-size: clamp(1.6rem, 4vw, 2.2rem); font-weight: 800; margin-bottom: .4rem; }
    .page-head p  { color: var(--muted); font-size: .9rem; }

    /* ── FILTER TABS ── */
    .lb-tabs {
      display: flex; justify-content: center; gap: .6rem; flex-wrap: wrap;
      margin-bottom: 2rem;
    }
    .lb-tab {
      padding: .5rem 1.2rem; border-radius: 999px;
      font-size: .82rem; font-weight: 700; cursor: pointer;
      border: 1px solid var(--border); background: var(--card); color: var(--muted);
      transition: all .2s;
    }
    .lb-tab.active { background: var(--purple); border-color: var(--purple); color: #fff; }
    .lb-tab:hover:not(.active) { border-color: var(--purple); color: var(--text); }

    /* ── PODIUM ── */
    .podium {
      display: flex; align-items: flex-end; justify-content: center;
      gap: 1rem; margin-bottom: 2.5rem;
    }
    .podium-item { text-align: center; width: 130px; }
    .podium-avatar {
      width: 56px; height: 56px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem; margin: 0 auto .6rem;
      border: 3px solid var(--card);
    }
    .podium-item.p1 .podium-avatar { width: 72px; height: 72px; font-size: 1.9rem; border-color: #FBBF24; box-shadow: 0 0 24px rgba(251,191,36,.5); }
    .podium-item.p2 .podium-avatar { border-color: #94A3B8; }
    .podium-item.p3 .podium-avatar { border-color: #CD7F32; }
    .podium-name { font-size: .85rem; font-weight: 700; }
    .podium-sub  { font-size: .72rem; color: var(--muted); margin-bottom: .4rem; }
    .podium-bar {
      border-radius: 14px 14px 0 0;
      display: flex; align-items: flex-start; justify-content: center;
      padding-top: .6rem;
      font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 1.1rem;
    }
    .p1 .podium-bar { height: 100px; background: linear-gradient(180deg, rgba(251,191,36,.35), rgba(251,191,36,.1)); color: #FBBF24; }
    .p2 .podium-bar { height: 70px;  background: linear-gradient(180deg, rgba(148,163,184,.3), rgba(148,163,184,.08)); color: #CBD5E1; }
    .p3 .podium-bar { height: 50px;  background: linear-gradient(180deg, rgba(205,127,50,.3), rgba(205,127,50,.08)); color: #E0A96D; }

    /* ── MY RANK ── */
    .my-rank {
      background: linear-gradient(135deg, rgba(124,58,237,.25), rgba(59,130,246,.15));
      border: 1px solid var(--purple);
      border-radius: 18px; padding: 1.1rem 1.5rem;
      display: flex; align-items: center; gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .my-rank .rank-num { font-family: 'Space Grotesk', sans-serif; font-weight: 800; font-size: 1.3rem; color: var(--purple-light); width: 36px; text-align:center; }
    .my-rank .av { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, var(--purple), var(--blue)); display:flex; align-items:center; justify-content:center; font-weight:700; color:#fff; flex-shrink:0; }
    .my-rank .info { flex: 1; }
    .my-rank .info .nm { font-weight: 700; font-size: .92rem; }
    .my-rank .info .sb { font-size: .76rem; color: var(--muted); }
    .my-rank .xp { font-family: 'Space Grotesk', sans-serif; font-weight: 700; color: var(--yellow); }
  </style>
</head>
<body>
