<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leaderboard - BelajarBareng.id</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .lb-tabs { display:flex; justify-content:center; gap:8px; margin-bottom:25px; flex-wrap:wrap; }
    .lb-tab { padding:9px 18px; border:2px solid var(--ink); border-radius:999px; font-size:13px; font-weight:600; cursor:pointer; background:#fff; color:var(--ink); }
    .lb-tab.active { background:var(--ink); border-color:var(--ink); color:#fff; }
    .my-rank { background:var(--gold-tint); border:2px solid var(--gold); border-radius:var(--radius); padding:16px 20px; display:flex; align-items:center; gap:12px; margin-bottom:22px; box-shadow:var(--shadow-sm); }
    .my-rank .rank-num { font-weight:700; color:#7A5300; width:32px; text-align:center; font-family:'Baloo 2', sans-serif; }
  </style>
</head>
<body>

  <nav>
    <div class="nav-logo">BelajarBareng.id</div>
    <div class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="materi.html">Materi</a>
      <a href="tutor.html">AI Tutor</a>
      <a href="leaderboard.html" class="btn-nav">Leaderboard</a>
    </div>
  </nav>

  <div class="section" style="max-width:800px;">
    <h1 style="text-align:center;">Leaderboard Nasional</h1>
    <p style="text-align:center; color:#666; margin-bottom:20px;">Lihat siapa yang paling rajin belajar minggu ini</p>

    <div class="lb-tabs">
      <div class="lb-tab active">Minggu Ini</div>
      <div class="lb-tab">Bulan Ini</div>
      <div class="lb-tab">Sepanjang Masa</div>
    </div>

    <div class="my-rank" id="myRank" style="display:none;">
      <div class="rank-num" id="myRankNum">#-</div>
      <div class="avatar" id="myRankAv">P</div>
      <div style="flex:1;">
        <div style="font-weight:bold;" id="myRankName">Kamu</div>
        <div style="font-size:12px; color:#666;" id="myRankSub">-</div>
      </div>
      <div style="font-weight:bold; color:var(--primary-dark);" id="myRankXp">0 XP</div>
    </div>

    <div class="lboard">
      <div class="lboard-head">Peringkat Lengkap</div>
      <div id="lboardList"></div>
    </div>
  </div>

  <footer>&copy; 2025 BelajarBareng.id - Tugas Pemrograman Web</footer>

  <script>
    const data = [
      { rank:1, nama:'Anindita R.', sekolah:'SMA 1 Yogyakarta', xp:12450 },
      { rank:2, nama:'Bagas Pratama', sekolah:'SMPN 5 Surabaya', xp:11800 },
      { rank:3, nama:'Siti Nurhaliza', sekolah:'SMA 3 Bandung', xp:10990 },
      { rank:4, nama:'Kevin Santoso', sekolah:'SMA 2 Semarang', xp:9750 },
      { rank:5, nama:'Putri Melati', sekolah:'SMPN 2 Medan', xp:9310 },
      { rank:6, nama:'Farhan Aditya', sekolah:'SMA 1 Malang', xp:8890 },
      { rank:7, nama:'Nabila Putri', sekolah:'SMPN 3 Jakarta', xp:8540 },
      { rank:8, nama:'Rizky Ramadhan', sekolah:'SMA 4 Bekasi', xp:8120 },
      { rank:9, nama:'Aisyah Zahra', sekolah:'SMPN 1 Bogor', xp:7860 },
      { rank:10, nama:'Dimas Prayoga', sekolah:'SMA 5 Surabaya', xp:7500 },
    ];

    function rankClass(r) { return r === 1 ? 'gold' : r === 2 ? 'silver' : r === 3 ? 'bronze' : ''; }

    document.getElementById('lboardList').innerHTML = data.map(d => `
      <div class="lboard-row">
        <div class="rank ${rankClass(d.rank)}">${d.rank}</div>
        <div class="avatar">${d.nama[0]}</div>
        <div>
          <div class="lboard-name">${d.nama}</div>
          <div class="lboard-sub">${d.sekolah}</div>
        </div>
        <div class="lboard-pts">${d.xp.toLocaleString('id-ID')} XP</div>
      </div>
    `).join('');

    const raw = localStorage.getItem('bb_current');
    if (raw) {
      const user = JSON.parse(raw);
      const firstName = (user.nama || 'Pelajar').split(' ')[0];
      const xp = parseInt(user.xp || 0);
      let myRank = data.filter(d => d.xp > xp).length + 1;

      document.getElementById('myRank').style.display = 'flex';
      document.getElementById('myRankNum').textContent = '#' + myRank;
      document.getElementById('myRankAv').textContent = firstName[0].toUpperCase();
      document.getElementById('myRankName').textContent = user.nama || 'Pelajar';
      document.getElementById('myRankSub').textContent = (user.sekolah && user.sekolah !== '-' ? user.sekolah : (user.jenjang + ' ' + user.kelas)) + ' - Itu kamu!';
      document.getElementById('myRankXp').textContent = xp.toLocaleString('id-ID') + ' XP';
    }

    document.querySelectorAll('.lb-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.lb-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
      });
    });
  </script>
  <script src="auth-nav.js"></script>
</body>
</html>
