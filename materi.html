<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Materi - BelajarBareng.id</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .subj-tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px; }
    .subj-tab { padding:9px 16px; border:2px solid var(--ink); border-radius:999px; font-size:13px; font-weight:600; cursor:pointer; background:#fff; color:var(--ink); }
    .subj-tab.active { background:var(--ink); border-color:var(--ink); color:#fff; }
    .topic-list { list-style:none; margin:10px 0; font-size:13px; color:#555; }
    .topic-list li { padding:3px 0; }
    .topic-list li:before { content:"- "; }
  </style>
</head>
<body>

  <nav>
    <div class="nav-logo">BelajarBareng.id</div>
    <div class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="materi.html" class="btn-nav">Materi</a>
      <a href="tutor.html">AI Tutor</a>
      <a href="leaderboard.html">Leaderboard</a>
    </div>
  </nav>

  <div class="section">
    <h1>Materi Belajar</h1>
    <p id="pageSub" style="color:#666; margin-bottom:20px;">Pilih mapel untuk mulai belajar</p>

    <div class="subj-tabs" id="subjTabs"></div>
    <div class="card-grid" id="materiGrid"></div>
  </div>

  <div id="toast" style="display:none; position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#333; color:#fff; padding:10px 18px; border-radius:4px; font-size:13px;"></div>

  <footer>&copy; 2025 BelajarBareng.id - Tugas Pemrograman Web</footer>

  <script>
    const raw = localStorage.getItem('bb_current');
    if (!raw) window.location.href = 'login.html';
    const user = JSON.parse(raw || '{}');

    document.getElementById('pageSub').textContent = 'Materi untuk ' + (user.jenjang || '') + ' ' + (user.kelas || '');

    const materiData = {
      SMP: {
        'Kelas 7': [
          { nama:'Matematika', topics:['Bilangan Bulat','Himpunan','Aljabar','Persamaan Linear'], prog:35, page:'matematikakelas7.html' },
          { nama:'IPA', topics:['Pengukuran','Klasifikasi Makhluk Hidup','Zat & Perubahannya'], prog:20 },
          { nama:'IPS', topics:['Keragaman Lingkungan','Interaksi Sosial'], prog:10 },
        ],
        'Kelas 8': [
          { nama:'Matematika', topics:['Pola Bilangan','SPLDV','Teorema Pythagoras'], prog:15 },
          { nama:'IPA', topics:['Gerak Lurus','Gaya & Hukum Newton'], prog:0 },
        ],
        'Kelas 9': [
          { nama:'Matematika', topics:['Perpangkatan','Persamaan Kuadrat','Statistika'], prog:0 },
          { nama:'IPA', topics:['Sistem Reproduksi','Kelistrikan'], prog:0 },
        ],
      },
      SMA: {
        'Kelas 10': [
          { nama:'Matematika', topics:['Eksponen & Logaritma','Trigonometri Dasar'], prog:25 },
          { nama:'Kimia', topics:['Struktur Atom','Ikatan Kimia'], prog:0 },
          { nama:'Fisika', topics:['Besaran & Vektor','Hukum Newton'], prog:0 },
        ],
        'Kelas 11': [
          { nama:'Matematika', topics:['Program Linear','Matriks','Limit Fungsi'], prog:10 },
          { nama:'Kimia', topics:['Termokimia','Laju Reaksi'], prog:0 },
        ],
        'Kelas 12': [
          { nama:'Matematika', topics:['Statistika','Peluang','Integral'], prog:5 },
          { nama:'Kimia', topics:['Elektrokimia','Polimer'], prog:0 },
          { nama:'Fisika', topics:['Listrik Statis','Fisika Inti'], prog:0 },
        ],
      },
    };

    const kelasMateri = (materiData[user.jenjang] || {})[user.kelas] || [];

    const tabsEl = document.getElementById('subjTabs');
    tabsEl.innerHTML = ['Semua', ...kelasMateri.map(m => m.nama)].map((label, i) =>
      `<div class="subj-tab ${i === 0 ? 'active' : ''}" data-label="${label}">${label}</div>`
    ).join('');

    tabsEl.querySelectorAll('.subj-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        tabsEl.querySelectorAll('.subj-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        const label = tab.dataset.label;
        document.querySelectorAll('.materi-card').forEach(card => {
          card.style.display = (label === 'Semua' || card.dataset.nama === label) ? '' : 'none';
        });
      });
    });

    const grid = document.getElementById('materiGrid');
    if (kelasMateri.length === 0) {
      grid.innerHTML = '<p style="color:#888;">Materi belum tersedia untuk kelasmu.</p>';
    } else {
      grid.innerHTML = kelasMateri.map(m => `
        <div class="card materi-card" data-nama="${m.nama}" onclick="bukaMateri('${m.nama}', '${m.page || ''}')" style="cursor:pointer;">
          <h3>${m.nama}</h3>
          <ul class="topic-list">
            ${m.topics.map(t => `<li>${t}</li>`).join('')}
          </ul>
          <div class="progress-track"><div class="progress-fill" style="width:${m.prog}%"></div></div>
          <div style="font-size:12px; color:#888;">${m.prog}% selesai</div>
        </div>
      `).join('');
    }

    function bukaMateri(nama, page) {
      if (page) {
        window.location.href = page;
        return;
      }
      const t = document.getElementById('toast');
      t.textContent = 'Membuka materi "' + nama + '"...';
      t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', 2000);
    }
  </script>
  <script src="auth-nav.js"></script>
</body>
</html>
